version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: hellodesk-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hellodesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hellodesk-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./hellodesk-server
      dockerfile: Dockerfile
    container_name: hellodesk-server
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/hellodesk?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "dev-super-secret-jwt-key-2026"
      SERVER_BASE_URL: "http://localhost:3001"
      APP_BASE_URL: "http://localhost:3000"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./hellodesk-client
      dockerfile: Dockerfile
    container_name: hellodesk-client
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SERVER_URL: "http://localhost:3001"
      NEXT_PUBLIC_WS_URL: "http://localhost:3001"
    depends_on:
      - server

volumes:
  postgres_data:
